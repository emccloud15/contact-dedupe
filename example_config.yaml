# Copy this file and replace the example CSV column names with your own.
# All names under COLUMNS, BLOCKING, MATCH_FIELD, NICKNAME, and EXCLUSION
# must exist in the input CSV.

CLIENT_NAME: acme_contacts

COLUMNS:
  name:
    include_name: false
    weight:
      - [First Name, 0.15]
      - [Last Name, 0.15]
    columns:
      - First Name
      - Last Name

  email:
    include_name: false
    weight: 0.25
    columns:
      - Email
      - Alternate Email

  phone:
    include_name: false
    weight: 0.20
    columns:
      - Phone
      - Mobile Phone

  address:
    include_name: false
    weight: 0.25
    # Address columns are cleaned individually and compared as address fields.
    columns:
      - Street
      - City
      - State
      - ZIP

# The older BLOCKING section remains required for compatibility. New runs
# should normally use CANDIDATE_BLOCKS for multiple blocking strategies.
BLOCKING:
  strict: false
  type: zipcode
  column: ZIP
  portion: start

CANDIDATE_BLOCK_PROFILE: default_v1

CANDIDATE_BLOCK_PROFILES:
  default_v1:
    - type: exact
      field: email
      max_bucket_size: 500
    - type: exact
      field: phone
      max_bucket_size: 500
    - type: prefix
      field: postal_code
      length: 3
      direction: start
      max_bucket_size: 1000
    - type: composite
      fields: [last_name, postal_code]
      max_bucket_size: 500
  

MATCHING_PROFILE: balanced_v1

# Rules are built dynamically from the configured column names and contact groups.
# Use _and_/_or_ for inner operators and double underscores for an outer layer.
MATCHING_PROFILES:
  balanced_v1:
    auto_merge_rule: email_high_or_phone_high
    auto_ignore_rule: match_score_low

MAIN_MATCH_CRITERIA: Email
MATCH_FIELD: Contact ID
NICKNAME: First Name

BOUNDS:
  u_bound: 90
  l_bound: 75

# Optional controls.
EXCLUSION:
  column: Account ID
ADDRESS: false
STRICT_MATCH: false
BASE: false
